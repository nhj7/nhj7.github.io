    /* ── Reset & Base ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #1a56db;
      --primary-d: #1344b0;
      --accent:    #f59e0b;
      --bg:        #f1f5f9;
      --surface:   #ffffff;
      --text:      #1e293b;
      --text-s:    #64748b;
      --border:    #e2e8f0;
      --radius:    18px;
      --shadow:    0 8px 32px rgba(0,0,0,.10);
    }

    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }
    nav a {
      color: var(--text-s);
      text-decoration: none;
      font-size: .9rem;
      margin-left: 20px;
      transition: color .2s;
    }
    nav a:hover { color: var(--primary); }

    /* ── Hero ──────────────────────────────────────── */
    .hero {
      text-align: center;
      padding: 56px 24px 40px;
    }
    .hero h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.25;
    }
    .hero h1 em {
      font-style: normal;
      color: var(--primary);
    }
    .hero p {
      margin-top: 12px;
      color: var(--text-s);
      font-size: 1rem;
    }

    /* ── Category Tabs ─────────────────────────────── */
    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 36px;
      padding: 0 16px;
    }
    .tab-btn {
      padding: 8px 20px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-s);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .tab-btn:hover, .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ── Card Grid ─────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* ── Card ──────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      overflow: hidden;
      transition: transform .25s, box-shadow .25s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(0,0,0,.14);
    }
    .card-thumb {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      position: relative;
      overflow: hidden;
    }
    .card-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 60%);
    }
    .card-body { padding: 20px 20px 18px; flex: 1; }
    .card-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: .72rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: .85rem;
      color: var(--text-s);
      line-height: 1.6;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      font-size: .78rem;
      color: var(--text-s);
    }
    .slide-count {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .slide-count svg { width:14px; height:14px; }

    /* ── Modal Overlay ─────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    /* ── Slide Viewer ──────────────────────────────── */
    .viewer {
      background: var(--surface);
      border-radius: 20px;
      width: 100%;
      max-width: 540px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.3);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }
    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .viewer-title { font-size: .95rem; font-weight: 700; }
    .close-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-s); font-size: 1.4rem; line-height: 1;
      padding: 4px 8px;
      transition: color .2s;
    }
    .close-btn:hover { color: var(--text); }

    /* ── Slide Area ─────────────────────────────────── */
    .slides-wrapper {
      position: relative;
      flex: 1;
      overflow: hidden;
    }
    .slide {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 36px 32px 28px;
      min-height: 400px;
      animation: slideIn .3s ease;
    }
    .slide.active { display: flex; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .slide-num {
      font-size: .75rem;
      font-weight: 600;
      color: #fff;
      background: rgba(0,0,0,.25);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
      align-self: flex-end;
    }
    .slide-icon { font-size: 3.2rem; margin-bottom: 16px; }
    .slide-headline {
      font-size: 1.35rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.35;
      margin-bottom: 16px;
      color: #fff;
    }
    .slide-body {
      font-size: .9rem;
      text-align: center;
      line-height: 1.8;
      color: rgba(255,255,255,.9);
      max-width: 420px;
    }
    .slide-highlight {
      display: inline-block;
      background: rgba(255,255,255,.2);
      border-radius: 8px;
      padding: 2px 10px;
      font-weight: 700;
      margin: 0 2px;
    }
    .slide-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      background: rgba(255,255,255,.12);
      border-radius: 10px;
      overflow: hidden;
      font-size: .85rem;
    }
    .slide-table th {
      background: rgba(255,255,255,.2);
      color: #fff;
      padding: 9px 14px;
      text-align: left;
      font-weight: 700;
    }
    .slide-table td {
      color: rgba(255,255,255,.9);
      padding: 9px 14px;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .slide-list {
      list-style: none;
      text-align: left;
      width: 100%;
      margin-top: 14px;
    }
    .slide-list li {
      color: rgba(255,255,255,.9);
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.1);
      font-size: .88rem;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .slide-list li:last-child { border-bottom: none; }
    .bullet { flex-shrink: 0; font-size: 1rem; }

    /* ── Slide Controls ─────────────────────────────── */
    .viewer-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .nav-btn {
      padding: 9px 22px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .nav-btn:disabled { opacity: .35; cursor: default; }
    .progress-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: all .25s;
      cursor: pointer;
    }
    .dot.active {
      width: 22px;
      border-radius: 4px;
      background: var(--primary);
    }

    /* ── Footer ─────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-s);
      font-size: .8rem;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--primary); text-decoration: none; }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 480px) {
      .grid { padding: 0 14px 48px; gap: 16px; }
      .slide { padding: 28px 20px 20px; min-height: 340px; }
      .slide-headline { font-size: 1.15rem; }
    }
  </style>
</head>

        bg: "linear-gradient(135deg, #065f46 0%, #064e3b 100%)",
        icon: "💡",
        headline: "이렇게 활용하세요",
        body: "비상금·단기 여윳돈 → <span class='slide-highlight'>파킹통장</span>\n3~6개월 이상 묶을 돈 → <span class='slide-highlight'>정기예금</span>\n1년 이상 장기 → <span class='slide-highlight'>ISA 또는 연금저축</span>\n\n분산 배치가 절세와 수익률 모두 유리합니다."
      }
    ]
  }
];

/* ═══════════════════════════════════════════
   RENDER CARDS
   ═══════════════════════════════════════════ */
function renderCards(cat) {
  const grid = document.getElementById('grid');
  const filtered = cat === 'all' ? CARDS : CARDS.filter(c => c.cat === cat);
  grid.innerHTML = filtered.map(card => `
    <div class="card" onclick="openViewer(${card.id})">
      <div class="card-thumb" style="background:${card.color}">
        <span style="font-size:3.6rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,.2))">${card.thumb}</span>
      </div>
      <div class="card-body">
        <div class="card-badge" style="background:${card.badge.bg};color:${card.badge.color}">${card.badge.text}</div>
        <div class="card-title">${card.title}</div>
        <div class="card-desc">${card.desc}</div>
      </div>
      <div class="card-footer">
        <span>${card.date}</span>
        <span class="slide-count">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
          </svg>
          ${card.slides.length}장
        </span>
      </div>
    </div>
  `).join('');
}

/* ═══════════════════════════════════════════
   VIEWER LOGIC
   ═══════════════════════════════════════════ */
let current = { card: null, idx: 0 };

function buildSlideHTML(slide) {
  let inner = '';
  if (slide.table) {
    inner = `<table class="slide-table">
      <tr>${slide.table.headers.map(h=>`<th>${h}</th>`).join('')}</tr>
      ${slide.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
    </table>`;
  } else if (slide.list) {
    inner = `<ul class="slide-list">${slide.list.map(li=>`
      <li><span class="bullet">${li.emoji}</span>${li.text}</li>`).join('')}</ul>`;
  } else if (slide.body) {
    inner = `<p class="slide-body">${slide.body.replace(/\n/g,'<br>')}</p>`;
  }

  return `<div class="slide" style="background:${slide.bg}">
    <div class="slide-num">${current.idx + 1} / ${current.card.slides.length}</div>
    <div class="slide-icon">${slide.icon}</div>
    <div class="slide-headline">${slide.headline.replace(/\n/g,'<br>')}</div>
    ${inner}
  </div>`;
}

function refreshViewer() {
  const card = current.card;
  const idx  = current.idx;

  document.getElementById('viewer-title').textContent = card.title;

  // Slides
  const wrapper = document.getElementById('slides-wrapper');
  wrapper.innerHTML = card.slides.map((s, i) => {
    const savedIdx = current.idx;
    current.idx = i;
    const html = buildSlideHTML(s);
    current.idx = savedIdx;
    return html;
  }).join('');

  const allSlides = wrapper.querySelectorAll('.slide');
  allSlides.forEach((el, i) => el.classList.toggle('active', i === idx));

  // Dots
  const dots = document.getElementById('dots');
  dots.innerHTML = card.slides.map((_, i) =>
    `<div class="dot ${i === idx ? 'active' : ''}" onclick="goTo(${i})"></div>`
  ).join('');

  // Buttons
  document.getElementById('prev-btn').disabled = idx === 0;
  document.getElementById('next-btn').disabled = idx === card.slides.length - 1;

  // Update slide number labels
  allSlides.forEach((el, i) => {
    const numEl = el.querySelector('.slide-num');
    if (numEl) numEl.textContent = `${i + 1} / ${card.slides.length}`;
  });
}

function openViewer(id) {
  current.card = CARDS.find(c => c.id === id);
  current.idx  = 0;
  refreshViewer();
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function goTo(idx) {
  current.idx = idx;
  refreshViewer();
}

document.getElementById('prev-btn').addEventListener('click', () => {
  if (current.idx > 0) { current.idx--; refreshViewer(); }
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (current.idx < current.card.slides.length - 1) { current.idx++; refreshViewer(); }
});
document.getElementById('close-btn').addEventListener('click', closeViewer);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeViewer();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
  if (e.key === 'ArrowLeft')  document.getElementById('prev-btn').click();
  if (e.key === 'Escape')     closeViewer();
});

// Touch swipe
let touchX = 0;
document.querySelector('.viewer').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
document.querySelector('.viewer').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx < -50) document.getElementById('next-btn').click();
  if (dx >  50) document.getElementById('prev-btn').click();
});

/* ═══════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════ */
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards(btn.dataset.cat);
});

// Init
renderCards('all');
</script>
</body>
</html>
